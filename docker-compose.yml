# Moodle 5.3 test stack: Moodle (built from source, with a background cron loop)
# + PostgreSQL 17. Moodle 5.3 requires PostgreSQL 17 (Debian 12 / YunoHost 12
# ships only 15, which is why 5.3 can't run there natively - Docker supplies 17
# here). For local experimentation only - this is NOT the YunoHost package.
# Bring it up with:  docker compose up -d --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle:
    build:
      context: .
      args:
        MOODLE_BRANCH: ${MOODLE_BRANCH}
    image: moodle-sandbox:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS}
      MOODLE_SSLPROXY: ${MOODLE_SSLPROXY:-false}
      MOODLE_ROUTER: ${MOODLE_ROUTER:-true}
      MOODLE_AUTO_UPGRADE: ${MOODLE_AUTO_UPGRADE:-true}
      # PHP_* values are the sandbox's equivalent of the YunoHost config panel's
      # "PHP & performance" tab; CRON_INTERVAL drives the built-in cron loop.
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_MAX_INPUT_VARS: ${PHP_MAX_INPUT_VARS:-5000}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-1G}
      CRON_INTERVAL: ${CRON_INTERVAL:-15}
    ports:
      # BIND_HOST=127.0.0.1 keeps the port private (only a host-side reverse
      # proxy can reach it); the default 0.0.0.0 exposes it for direct IP access.
      - "${BIND_HOST:-0.0.0.0}:${HTTP_PORT}:80"
    volumes:
      - moodledata:/var/www/moodledata

volumes:
  dbdata:
  moodledata:
