# Moodle 5.3 test stack: Moodle (built from source) + PostgreSQL 16.
# For local experimentation only - this is NOT the YunoHost package.
# Bring it up with:  docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle:
    build:
      context: .
      args:
        MOODLE_BRANCH: ${MOODLE_BRANCH}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS}
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - moodledata:/var/www/moodledata

volumes:
  dbdata:
  moodledata:
